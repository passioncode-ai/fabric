# The runner and its services. Everything this workflow DOES lives in
# `scripts/ci.sh`, which is the point (REL-01).
#
# A check that can only be exercised by pushing is a check nobody debugs, and
# one nobody can watch fail is not proven — the standard every other gate in
# this repository is held to. So the workflow provides a machine and calls the
# script; the script is what was broken on purpose and watched refusing, on a
# laptop, before this file existed.

name: ci

# The fast job answers every push. The full job runs in the nightly batch
# (operator's CI policy of 2026-09-25: 23:00 Europe/Warsaw, org-index
# docs/CI-BATCHING.md) and on a manual dispatch for an urgent candidate:
# `gh workflow run ci.yml --ref <branch>`.
on:
  push:
    branches: ['**']
  pull_request:
  schedule:
    - cron: '0 21 * * *'   # 23:00 Warsaw in summer time
    - cron: '0 22 * * *'   # 23:00 Warsaw in winter time
  workflow_dispatch:

concurrency:
  # A second push supersedes the first: two runs of the same branch tell you the
  # same thing and only the later one is about the code you have. The event is in
  # the group so the nightly schedule never cancels a push run on the same ref
  # (2026-10-22: push run 39699805163 on main was cancelled by the 00:34 schedule,
  # and the release guard then had to wait for the schedule's run).
  # scripts/check-workflows.py refuses a scheduled workflow whose group omits it.
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  gate:
    # Two crons cover both offsets of Europe/Warsaw; only the one that lands on
    # 23:00 local runs the batch, so the suite runs once a night, not twice.
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      run: ${{ steps.hour.outputs.run }}
    steps:
      - id: hour
        run: |
          # By the cron that fired and Warsaw's offset, not by the hour the job starts: GitHub starts scheduled runs one
          # to three hours late, so the hour was never 23 and no nightly batch ran (0.3.5 verification, iteration 3, PL-1).
          off=$(TZ=Europe/Warsaw date +%z); want="0 22 * * *"; [ "$off" = "+0200" ] && want="0 21 * * *"
          if [ "${{ github.event.schedule }}" = "$want" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; else echo "the 23:00 Warsaw cron is \"$want\" at offset $off, this one is \"${{ github.event.schedule }}\"; skipping"; echo "run=false" >> "$GITHUB_OUTPUT"; fi

  fast:
    # Types, the interface and documentation gates, the register arithmetic and
    # every pure test. Proven stack-independent by running it with the local
    # stack STOPPED, not by assuming it.
    name: fast — no database
    needs: gate
    if: ${{ !cancelled() && (github.event_name != 'schedule' || needs.gate.outputs.run == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Documentation source receipts reference immutable research revisions.
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Documentation gate prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ripgrep
          python3 -m pip install -r scripts/requirements-ci.txt
      - run: pnpm install --frozen-lockfile
      - run: ./scripts/ci.sh fast

  full:
    # The probes that talk to the database: the journal's contract, the schema's
    # planted defects, the agent surface, memory retrieval, the operating
    # surfaces. Slower by minutes, so it does not gate the fast answer, and it
    # runs in the nightly batch or on a manual dispatch, never per push.
    # ci.sh starts a DISPOSABLE stack (scripts/test-stack.mjs) and the eleven
    # owned-cluster suites, which need PostgreSQL 17 binaries (FABRIC_PG_BIN).
    name: full — with a disposable stack
    runs-on: ubuntu-latest
    needs: [gate, fast]
    if: ${{ !cancelled() && needs.fast.result == 'success' && (github.event_name == 'workflow_dispatch' || needs.gate.outputs.run == 'true') }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Documentation source receipts reference immutable research revisions.
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Documentation gate prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ripgrep
          python3 -m pip install -r scripts/requirements-ci.txt
      - name: PostgreSQL 17 binaries for the owned-cluster suites
        run: |
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-17
          echo "FABRIC_PG_BIN=/usr/lib/postgresql/17/bin" >> "$GITHUB_ENV"
      - run: pnpm install --frozen-lockfile
      - run: ./scripts/ci.sh full
