# The release build: one signed, notarized and stapled universal DMG — Apple silicon and Intel Macs
# (operator decision 2026-10-09; no thin Intel-only Mach-O ships, scripts/after-pack-universal.mjs).
# Run through scripts/release-mac.mjs, in CI's protected `release` environment
# (.github/workflows/release.yml, ADR-0111). The script supplies the signing identity
# (`-c.mac.identity`, from the CI keychain the shared apple-signing action makes) and the
# notarization key; `pnpm package` keeps building the unsigned folder for local use.
extends: ./electron-builder.yml
artifactName: ${productName}-${version}-${arch}.${ext}
mac:
  target:
    - target: dmg
      arch:
        - universal
  # No identity here: the base config's `identity: null` (unsigned) is overridden on the command
  # line by scripts/release-mac.mjs with the identity CI hands it. A team id written here would be a
  # second, unreviewed source for which certificate signs Fabric.
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: resources/entitlements.mac.plist
  entitlementsInherit: resources/entitlements.mac.plist
  notarize: true
  icon: build/icon.png
  category: public.app-category.developer-tools
dmg:
  title: ${productName} ${version}
  sign: true
  contents:
    - x: 150
      y: 190
      type: file
    - x: 450
      y: 190
      type: link
      path: /Applications
  window:
    width: 600
    height: 400
