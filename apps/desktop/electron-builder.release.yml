# The release build: one signed, notarized and stapled DMG for Apple silicon.
# Run through scripts/release-mac.mjs, which supplies the notarization key from the secret store;
# `pnpm package` keeps building the unsigned folder for local use.
extends: ./electron-builder.yml
artifactName: ${productName}-${version}-${arch}.${ext}
mac:
  target:
    - target: dmg
      arch:
        - arm64
  # The Developer ID team, matched as a substring of the certificate name in the keychain; the
  # team id is printed in every signed binary's signature, the holder's name need not be here.
  identity: "KJ35UYYL22"
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: resources/entitlements.mac.plist
  entitlementsInherit: resources/entitlements.mac.plist
  notarize: true
  icon: build/icon.png
  category: public.app-category.developer-tools
dmg:
  title: ${productName} ${version}
  sign: true
  contents:
    - x: 150
      y: 190
      type: file
    - x: 450
      y: 190
      type: link
      path: /Applications
  window:
    width: 600
    height: 400
