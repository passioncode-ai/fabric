<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Fabric app icon (ADR-0100 D5): the PassionCode.ai mark, exact vector, on a graphite macOS tile.
       Tile on Apple's 1024 grid: 824×824 at (100,100), corner radius 185. Composed, not generated. -->
  <defs>
    <linearGradient id="fab-tile" x1="0" y1="100" x2="0" y2="924" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#231A2B"/>
      <stop offset="1" stop-color="#0B0A0E"/>
    </linearGradient>
    <radialGradient id="fab-glow" cx="512" cy="540" r="360" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F20673" stop-opacity="0.30"/>
      <stop offset="0.6" stop-color="#F20673" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#F20673" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fab-edge" x1="0" y1="100" x2="0" y2="924" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.16"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.03"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="fab-tile-shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <filter id="fab-mark-shadow" x="-20%" y="-20%" width="140%" height="145%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#05000A" flood-opacity="0.55"/>
    </filter>
    <clipPath id="fab-clip"><rect x="100" y="100" width="824" height="824" rx="185"/></clipPath>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#fab-tile)" filter="url(#fab-tile-shadow)"/>
  <g clip-path="url(#fab-clip)"><rect x="100" y="100" width="824" height="824" fill="url(#fab-glow)"/></g>
  <rect x="101.5" y="101.5" width="821" height="821" rx="183.5" fill="none" stroke="url(#fab-edge)" stroke-width="3"/>
  <g filter="url(#fab-mark-shadow)" transform="translate(512 520) scale(0.6) translate(-512 -512)">

  
  
  <defs>
