# Domain registry — the operator's own estate (org #1), published redacted
#
# REDACTED FOR PUBLICATION on 2026-09-30 (ADR-0096). The measured rows are kept — 40
# domains, their state, DNS shape, HTTP status, traffic, project linkage and expiry — so
# every count other documents cite from this file still holds. Identifying data is
# replaced: domain names are site-NN.example, projects are project-x, accounts are
# personal-a / personal-b / corporate; zone and account ids, e-mail addresses, DNS
# targets, page titles and repository names are removed. The unredacted registry stays
# on the operator's machine.
#
# SCOPE (decided at the stage-0 grill, 2026-08-16): the two personal Cloudflare accounts.
# A corporate account (31 zones) is OUT of scope: it has its own team and its own
# decisions.
#
# EVERY FIELD BELOW WAS MEASURED, NOT RECALLED. Method, 2026-08-16:
#   cloudflare.*  GET /zones?account.id=… and GET /zones/{id}/dns_records
#   http.*        curl -sSL --max-time 12 -A 'Mozilla/5.0' https://<domain>/
#   traffic.*     Cloudflare dashboard "unique visitors", pasted by the operator.
#                 THIS NUMBER COUNTS BOTS. A parked domain showing 1.8k has no
#                 demand behind it. Never use it alone as an aliveness signal.
#   project       matched by ripgrep over the operator's project directory (full
#                 domain, then bare label) and by `gh repo list`
#   expires       from the registrar panel; only the alphabetical tail was supplied,
#                 so most rows are `unknown` rather than absent.
#
# STATE VOCABULARY
#   live       HTTP 200 with a non-empty title
#   broken     DNS resolves, the server answers with an error
#   parked     DNS points at a registrar parking page
#   empty      Cloudflare zone exists with ZERO DNS records
#   mail_only  MX configured, no apex or www A/CNAME — nothing served on the web
#   no_zone    registered at the registrar, never added to Cloudflare

meta:
  measured_at: 2026-08-16
  domains: 40
  in_scope_accounts: [personal-a, personal-b]
  out_of_scope_accounts: [corporate]
  summary: {live: 15, broken: 7, parked: 1, empty: 8, mail_only: 4, no_zone: 5}
  known_gaps: ['Registrar inventory is incomplete: the operator supplied only the alphabetical tail (12
      rows). Domains earlier in the alphabet are unaccounted for. Closing this needs a CSV export or a
      registrar API key.', 'traffic.cf_unique_visitors is a dashboard paste, not an API read. Replace
      with the Cloudflare Analytics API when the collector ships.']
accounts:
  personal-a: {zones: 33}
  personal-b: {zones: 2}
  corporate: {zones: 31, in_scope: false, note: 'Corporate, with its own team and decisions. Holds 7 more
      domains that duplicate one personal cluster; recorded so the duplication is visible, not managed.'}
clusters:
  one_theme_one_repository:
    domains: [site-01.example, site-03.example, site-05.example, site-12.example, site-02.example, site-07.example,
      site-06.example, site-31.example, site-36.example]
    served_by: project-a
    note: Nine domains, one repository. Seven more of the same kind sit in the out-of-scope corporate
      account — 16 in total across two accounts on one theme.
  one_product_five_zones:
    domains: [site-11.example, site-25.example, site-26.example, site-23.example, site-27.example]
    note: One live, four empty zones bought in a single pass on 2026-07-19.
  personal_sites:
